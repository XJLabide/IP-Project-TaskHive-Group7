name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskhive
          POSTGRES_PASSWORD: taskhive
          POSTGRES_DB: taskhive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskhive -d taskhive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taskhive:taskhive@localhost:5432/taskhive?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Lint
        run: pnpm lint

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Model API roles in disposable PostgreSQL
        run: docker exec -i "${{ job.services.postgres.id }}" psql --username=taskhive --dbname=taskhive --set=ON_ERROR_STOP=1 < tests/database/api-roles.sql

      - name: Replay committed migrations
        run: pnpm db:migrate

      - name: Check public-table security
        run: pnpm db:security:check

      - name: Test PostgreSQL security boundary
        env:
          SECURITY_TEST_DATABASE_URL: postgresql://taskhive:taskhive@localhost:5432/taskhive?schema=public
        run: pnpm test:db-security

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test verification concurrency against PostgreSQL
        env:
          VERIFICATION_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm test:verification

      - name: Test Admin reads against PostgreSQL
        env:
          ADMIN_TEST_DATABASE_URL: postgresql://taskhive:taskhive@localhost:5432/taskhive?schema=public&connection_limit=2
        run: pnpm test:admin

      - name: Build
        run: pnpm build
